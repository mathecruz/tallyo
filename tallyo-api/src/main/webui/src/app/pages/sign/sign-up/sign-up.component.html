<h1 class="text-xl font-semibold mb-1 text-center">Crie sua conta</h1>
<p class="text-sm text-center mb-6">Leva menos de um minuto.</p>

<form
  [formGroup]="form"
  (ngSubmit)="onSubmit()"
  class="flex flex-col w-full gap-3"
>
  <p-float-label variant="in">
    <input
      id="first_name"
      class="w-full"
      type="text"
      pSize="small"
      pInputText
      formControlName="firstName"
      autocomplete="false"
    />
    <label for="first_name">Seu primeiro nome</label>
  </p-float-label>
  <p-float-label variant="in">
    <input
      id="last_name"
      class="w-full"
      type="text"
      pSize="small"
      pInputText
      formControlName="lastName"
      autocomplete="false"
    />
    <label for="last_name">Seu último nome</label>
  </p-float-label>
  <p-float-label variant="in">
    <input
      id="email"
      class="w-full"
      type="text"
      pSize="small"
      pInputText
      formControlName="email"
      autocomplete="false"
    />
    <label for="email">Seu melhor e-mail</label>
  </p-float-label>
  <p-float-label variant="in">
    <p-inputMask
      id="phone_number"
      styleClass="w-full"
      size="small"
      mask="(99) 99999-9999"
      formControlName="phoneNumber"
      autocomplete="off"
    />
    <label for="phone_number">Seu número de telefone</label>
  </p-float-label>
  <p-float-label variant="in">
    <input
      id="password"
      class="w-full"
      type="password"
      pSize="small"
      pInputText
      formControlName="password"
      autocomplete="false"
    />
    <label for="password">Sua senha</label>
  </p-float-label>
  <p-button
    type="submit"
    [style]="{ width: '100%' }"
    label="Cadastrar"
    severity="primary"
    size="small"
    [loading]="submitting"
    [disabled]="submitting"
  ></p-button>
  <p class="text-sm text-center mt-2">
    Já possui uma conta? Clique
    <a [routerLink]="['']" class="primary-emphasis font-normal">aqui</a>
    para acessar.
  </p>
</form>
