name: Tallyo CI - Build & Publish

on:
  push:
    branches: [ "main" ]
    paths:
      - 'tallyo-api/**'
      - 'whatsapp/**'
      - 'infrastructure/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'tallyo-api/**'
      - 'whatsapp/**'
      - 'infrastructure/**'
  workflow_dispatch:
    inputs:
      version:
        description: 'Image version (semver, e.g. 1.0.0, 2.0.0-SNAPSHOT, 1.0.0-alpha.1)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PUBLISH: ${{ github.repository == 'mathecruz/tallyo' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}

jobs:
  detect-changes:
    uses: ./.github/workflows/detect_changes.yml

  version:
    name: Resolve image version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Validate and resolve version
        id: resolve
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -z "$INPUT_VERSION" ]; then
            echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          SEMVER='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)(\.(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*))*))?$'
          if ! [[ "$INPUT_VERSION" =~ $SEMVER ]]; then
            echo "::error::'$INPUT_VERSION' is not a valid semver version"
            exit 1
          fi
          echo "tag=$INPUT_VERSION" >> "$GITHUB_OUTPUT"

  tallyo-api:
    name: Build & Publish - Tallyo API (Java)
    needs: [detect-changes, version]
    if: github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tallyo-api        

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build API
        run: mvn -B -ntp formatter:validate impsort:check package -Pollama

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tallyo-api/src/main/webui/package-lock.json

      - name: Check code formatting with Prettier
        working-directory: ./tallyo-api/src/main/webui
        run: npm run prettier:check

      - name: Set up Podman
        uses: gacts/install-podman@v1
        if: env.PUBLISH == 'true'
        id: podman

      - name: Login to Quay.io
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Create Docker image
        if: env.PUBLISH == 'true'
        run: docker build -f src/main/docker/Dockerfile.jvm -t quay.io/mathecruz/tallyo:${{ needs.version.outputs.tag }}-api .

      - name: Push Docker image to Quay.io
        if: env.PUBLISH == 'true'
        run: docker push quay.io/mathecruz/tallyo:${{ needs.version.outputs.tag }}-api

  whatsapp:
    name: Build & Publish - WhatsApp Bot (Node.js)
    needs: [detect-changes, version]
    if: github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.whatsapp == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: whatsapp

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: whatsapp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check code formatting with Prettier
        run: npm run prettier:check
        
      - name: Login to Quay.io
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Create Docker image
        if: env.PUBLISH == 'true'
        run: docker build -f Dockerfile -t quay.io/mathecruz/tallyo:${{ needs.version.outputs.tag }}-bot .

      - name: Push Docker image to Quay.io
        if: env.PUBLISH == 'true'
        run: docker push quay.io/mathecruz/tallyo:${{ needs.version.outputs.tag }}-bot